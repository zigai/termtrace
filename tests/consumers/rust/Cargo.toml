[package]
name = "termtrace-rust-consumer"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "termtrace-rust-consumer"
[features]
default = []
local = ["termtrace-sdk/in-process"]

[dependencies]
serde_json = "1.0.145"
termtrace-sdk = { path = "../../../crates/sdk", default-features = false }

[[bin]]
name = "termtrace-rust-consumer"
path = "src/main.rs"

[[bin]]
name = "local"
path = "src/bin/local.rs"
required-features = ["local"]

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"
required-features = ["local"]

[[bin]]
name = "testing_helpers"
path = "src/bin/testing_helpers.rs"
required-features = ["local"]

[[bin]]
name = "diagnostics_evidence"
path = "src/bin/diagnostics_evidence.rs"
required-features = ["local"]

[[bin]]
name = "original"
path = "src/bin/original.rs"
required-features = ["local"]
