[package]
name = "termtrace-rust-consumer"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "termtrace-rust-consumer"
[features]
default = []
local = ["termtrace-sdk/in-process"]

[dependencies]
serde_json = "1.0.145"
termtrace-sdk = { path = "../../../crates/sdk", default-features = false }

[[bin]]
name = "termtrace-rust-consumer"
path = "src/main.rs"

[[bin]]
name = "local"
path = "src/bin/local.rs"
required-features = ["local"]

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"
required-features = ["local"]

[[bin]]
name = "testing_helpers"
path = "src/bin/testing_helpers.rs"
required-features = ["local"]

[[bin]]
name = "diagnostics_evidence"
path = "src/bin/diagnostics_evidence.rs"
required-features = ["local"]

[[bin]]
name = "original"
path = "src/bin/original.rs"
required-features = ["local"]

[[bin]]
name = "editing"
path = "src/bin/editing.rs"
required-features = ["local"]

[[bin]]
name = "delivery"
path = "src/bin/delivery.rs"
required-features = ["local"]

[[bin]]
name = "workflow"
path = "../../../examples/sdk/rust/workflow.rs"
required-features = ["local"]

[[test]]
name = "workflow"
path = "tests/workflow.rs"
required-features = ["local"]

[[bin]]
name = "demo"
path = "../../../examples/sdk/rust/demo.rs"
required-features = ["local"]

[[test]]
name = "session"
path = "tests/session.rs"
required-features = ["local"]

[[test]]
name = "screen"
path = "tests/screen.rs"
required-features = ["local"]

[[test]]
name = "input"
path = "tests/input.rs"
required-features = ["local"]

[[test]]
name = "analysis"
path = "tests/analysis.rs"
required-features = ["local"]

[[test]]
name = "system"
path = "tests/system.rs"
required-features = ["local"]

[[test]]
name = "target"
path = "tests/target.rs"
required-features = ["local"]

[[test]]
name = "delivery"
path = "tests/delivery.rs"
required-features = ["local"]

[[bin]]
name = "native_playback"
path = "src/bin/native_playback.rs"
required-features = ["local"]

[[test]]
name = "native"
path = "tests/native.rs"
required-features = ["local"]
