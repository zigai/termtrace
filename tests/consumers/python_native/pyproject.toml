[project]
name = "consumer-python-native"
version = "0.1.0"
description = "Consumer test suite for native Python bindings"
requires-python = ">=3.10"
dependencies = ["termtrace", "pytest>=8.0.0", "pytest-asyncio>=0.24"]

[tool.uv.sources]
termtrace = { path = "../../../crates/bindings-python", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = ["coverage>=7.14.1", "mypy>=1.14.0"]

[tool.coverage.run]
source = ["../../../crates/bindings-python/python/termtrace"]
parallel = true
patch = ["subprocess"]
