# Install with: uvx pre-commit install
# Run manually with: uvx pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        files: ^(?:build\.rs|src/.*\.rs|tests/.*\.rs)$

      - id: ruff-check
        name: ruff check
        entry: >-
          uv run --project packages/python --with ruff
          ruff check --fix --force-exclude
        language: system
        types: [python]
        files: ^packages/python/(?:src/termtrace|scripts|tests)/
        exclude: ^packages/python/src/termtrace/_generated/

      - id: ruff-format
        name: ruff format
        entry: >-
          uv run --project packages/python --with ruff
          ruff format --force-exclude
        language: system
        types: [python]
        files: ^packages/python/(?:src/termtrace|scripts|tests)/
        exclude: ^packages/python/src/termtrace/_generated/
