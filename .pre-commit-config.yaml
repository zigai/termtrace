# Install with: uvx pre-commit install
# Run manually with: uvx pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        files: ^(?:build\.rs|(?:crates|src|tests)/.*\.rs)$

      - id: cargo-statement-spacing
        name: cargo statement-spacing
        entry: cargo statement-spacing check
        language: system
        pass_filenames: false
        files: ^(?:build\.rs|(?:crates|src|tests)/.*\.rs)$

      - id: shfmt
        name: shfmt
        entry: shfmt -i 4 -ci -w
        language: system
        types: [shell]
        exclude: ^vendor/
