# Install with: uvx pre-commit install
# Run manually with: uvx pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        files: ^(?:build\.rs|(?:crates|src|tests)/.*\.rs)$

      - id: cargo-statement-spacing
        name: cargo statement-spacing
        entry: cargo statement-spacing check
        language: system
        pass_filenames: false
        files: ^(?:build\.rs|(?:crates|src|tests)/.*\.rs)$

      - id: ruff-check
        name: ruff check
        entry: >-
          uv run --project packages/python --locked --group dev
          ruff check --fix --force-exclude
        language: system
        types: [python]
        files: ^packages/python/(?:termtrace|scripts|tests)/
        exclude: ^packages/python/termtrace/(?:transport/)?generated/

      - id: ruff-format
        name: ruff format
        entry: >-
          uv run --project packages/python --locked --group dev
          ruff format --force-exclude
        language: system
        types: [python]
        files: ^packages/python/(?:termtrace|scripts|tests)/
        exclude: ^packages/python/termtrace/(?:transport/)?generated/

      - id: oxfmt
        name: oxfmt
        entry: bun run --cwd packages/typescript format
        language: system
        pass_filenames: false
        files: ^packages/typescript/
        exclude: ^packages/typescript/(?:lib|src/transport/generated)/

      - id: shfmt
        name: shfmt
        entry: shfmt -i 4 -ci -w
        language: system
        types: [shell]
        exclude: ^vendor/
