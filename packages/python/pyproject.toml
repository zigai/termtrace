[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "termtrace"
version = "0.1.0"
description = "Typed sync and async clients for the Termtrace JSONL driver"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = ["msgspec>=0.21.1,<1"]

[project.optional-dependencies]
pytest = ["pytest>=8"]

[project.scripts]
termtrace = "termtrace.binary:main"

[dependency-groups]
codegen = ["datamodel-code-generator==0.68.1"]
dev = ["mypy==2.3.0", "pytest==9.1.1", "ruff==0.15.7"]

[project.entry-points.pytest11]
termtrace = "termtrace.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/termtrace"]
artifacts = ["src/termtrace/bin/termtrace"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
