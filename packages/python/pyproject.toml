[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "termtrace"
version = "0.1.0"
description = "Typed sync and async clients for the Termtrace JSONL driver"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
pytest = ["pytest>=8"]

[project.scripts]
termtrace = "termtrace.binary:main"

[project.entry-points.pytest11]
termtrace = "termtrace.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/termtrace"]
artifacts = ["src/termtrace/bin/termtrace"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
