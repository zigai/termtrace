[package]
name = "termtrace-model"
version = "0.1.0"
edition = "2024"
description = "Versioned data and protocol contracts for Termtrace terminal recordings"
repository = "https://github.com/zigai/termtrace"
license-file.workspace = true
rust-version = "1.97.1"

[dependencies]
base64 = "0.22.1"
blake3 = "1.8.2"
compact_str = { version = "0.8.2", features = ["serde"] }
regex = "1.12.2"
schemars = { version = "1.1.0", features = ["uuid1"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
uuid = { version = "1.18.1", features = ["serde", "v5", "v7"] }

[lints]
workspace = true
