[package]
name = "termtrace-engine"
version = "0.1.0"
edition = "2024"
description = "PTY recording, terminal replay, and observation for Termtrace"
repository = "https://github.com/zigai/termtrace"
license-file.workspace = true
rust-version = "1.97.1"

[dependencies]
blake3 = "1.8.2"
fs-err = "3.2.0"
nix = { version = "0.30.1", features = ["fs", "poll", "process", "signal", "socket", "term", "time", "user"] }
portable-pty = "0.9.0"
regex = "1.12.2"
rusqlite = { version = "0.40.2", default-features = false, features = ["libsqlite3-sys", "bundled", "fallible_uint"] }
rustix = { version = "1.1.4", features = ["termios"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
signal-hook = "0.3.18"
tracing = "0.1.41"
tempfile = "3.23.0"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
zstd = "0.13.3"
termtrace-model = { version = "=0.1.0", path = "../model" }
termtrace-terminal = { version = "=0.1.0", path = "../terminal" }
termtrace-evidence = { version = "=0.1.0", path = "../evidence" }
directories = "6.0.0"

[dev-dependencies]
proptest = "1.11.0"

[lints]
workspace = true
