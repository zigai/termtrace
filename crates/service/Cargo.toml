[package]
name = "termtrace-service"
version = "0.1.0"
edition = "2024"
description = "Reusable application services and orchestration for Termtrace"
repository = "https://github.com/zigai/termtrace"
license-file.workspace = true
rust-version = "1.97.1"

[dependencies]
termtrace-schema = { version = "=0.1.0", path = "../schema" }
termtrace-model = { version = "=0.1.0", path = "../model" }
termtrace-process = { version = "=0.1.0", path = "../process" }
termtrace-control = { version = "=0.1.0", path = "../control" }
termtrace-evidence = { version = "=0.1.0", path = "../evidence" }
termtrace-engine = { version = "=0.1.0", path = "../engine" }
termtrace-media = { version = "=0.1.0", path = "../media" }
termtrace-export = { version = "=0.1.0", path = "../export" }
termtrace-tmux = { version = "=0.1.0", path = "../tmux" }
fs-err = "3.2.0"
nix = { version = "0.30.1", features = ["fs", "poll", "signal", "socket", "user"] }
regex = "1.12.2"
schemars = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
assert_cmd = "2.0.17"
tempfile = "3.23.0"

[lints]
workspace = true
