[package]
name = "termtrace-python"
version = "0.1.0"
edition = "2024"
description = "Native Python bindings for Termtrace"
repository = "https://github.com/zigai/termtrace"
license-file.workspace = true
rust-version = "1.97.1"
publish = false

[lib]
name = "_termtrace"
crate-type = ["cdylib", "rlib"]

[dependencies]
termtrace-model = { version = "=0.1.0", path = "../model" }
termtrace-sdk = { version = "=0.1.0", path = "../sdk", features = ["in-process", "scenario"] }
fs-err = "3.2.0"
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
pyo3-stub-gen = "0.23.1"
rustpython-parser = { version = "0.4.0", default-features = false, features = [
    "location",
    "num-bigint",
] }
schemars = "1.1.0"
serde = "1.0.228"
serde_json = "1.0.145"
[lints]
workspace = true
