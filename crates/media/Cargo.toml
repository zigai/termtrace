[package]
name = "termtrace-media"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
blake3 = "1.8.2"
fs-err = "3.2.0"
nix = { version = "0.30.1", features = ["fs", "poll", "term"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
termtrace-model = { path = "../model" }
termtrace-terminal = { path = "../terminal" }
termtrace-evidence = { path = "../evidence" }
termtrace-engine = { path = "../engine" }
termtrace-render = { path = "../render" }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
