[package]
name = "termtrace-media"
version = "0.1.0"
edition = "2024"
description = "Native terminal capture and media production for Termtrace"
repository = "https://github.com/zigai/termtrace"
license-file.workspace = true
rust-version = "1.97.1"

[dependencies]
blake3 = "1.8.2"
fs-err = "3.2.0"
nix = { version = "0.30.1", features = [
    "fs",
    "poll",
    "process",
    "signal",
    "socket",
    "term",
    "user",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
termtrace-model = { version = "=0.1.0", path = "../model" }
termtrace-process = { version = "=0.1.0", path = "../process" }
termtrace-control = { version = "=0.1.0", path = "../control" }
termtrace-terminal = { version = "=0.1.0", path = "../terminal" }
termtrace-evidence = { version = "=0.1.0", path = "../evidence" }
termtrace-engine = { version = "=0.1.0", path = "../engine" }
termtrace-render = { version = "=0.1.0", path = "../render" }
rustix = { version = "1.1.4", features = ["termios"] }
x11rb = { version = "0.14.0", default-features = false }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
