[package]
name = "termtrace-control"
version = "0.1.0"
edition = "2024"
description = "Client transport and phase observation for live Termtrace sessions"
repository = "https://github.com/zigai/termtrace"
license-file.workspace = true
rust-version = "1.97.1"

[dependencies]
termtrace-model = { version = "=0.1.0", path = "../model" }
termtrace-process = { version = "=0.1.0", path = "../process" }
nix = { version = "0.30.1", features = ["poll", "socket", "user"] }
serde = "1.0.228"
serde_json = "1.0.145"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
