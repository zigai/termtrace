[package]
name = "termtrace-terminal"
version = "0.1.0"
edition = "2024"
description = "Pinned libghostty-vt terminal semantics for Termtrace"
repository = "https://github.com/zigai/termtrace"
license-file.workspace = true
rust-version = "1.97.1"

[dependencies]
blake3 = "1.8.2"
compact_str = { version = "0.8.2", features = ["serde"] }
memchr = "2.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
termtrace-model = { version = "=0.1.0", path = "../model" }
proptest = "1.11.0"

[lints]
workspace = true
