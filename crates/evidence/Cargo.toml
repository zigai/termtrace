[package]
name = "termtrace-evidence"
version = "0.1.0"
edition = "2024"
description = "Integrity-checked canonical terminal recording storage for Termtrace"
repository = "https://github.com/zigai/termtrace"
license-file.workspace = true
rust-version = "1.97.1"

[dependencies]
blake3 = "1.8.2"
fs-err = "3.2.0"
itoa = "1.0.18"
nix = { version = "0.30.1", features = ["fs", "user"] }
rustix = { version = "1.1.4", features = ["system"] }
rusqlite = { version = "0.40.2", default-features = false, features = [
    "libsqlite3-sys",
    "bundled",
    "fallible_uint",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
serde_path_to_error = "0.1.20"
tar_archive = { package = "tar", version = "0.4.46" }
zstd = "0.13.3"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
termtrace-model = { version = "=0.1.0", path = "../model" }
termtrace-process = { version = "=0.1.0", path = "../process" }
tempfile = "3.23.0"

[dev-dependencies]
proptest = "1.11.0"

[lints]
workspace = true
