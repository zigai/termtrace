[package]
name = "termtrace-evidence"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
blake3 = "1.8.2"
fs-err = "3.2.0"
nix = { version = "0.30.1", features = ["fs", "user"] }
rustix = { version = "1.1.4", features = ["system"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_path_to_error = "0.1.20"
tar_archive = { package = "tar", version = "0.4.46" }
zstd = "0.13.3"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
termtrace-model = { path = "../model" }
tempfile = "3.23.0"

[dev-dependencies]
proptest = "1.11.0"

[lints]
workspace = true
