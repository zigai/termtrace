[package]
name = "termtrace-schema"
version = "0.1.0"
edition = "2024"
description = "JSON Schema catalog for Termtrace public contracts"
repository = "https://github.com/zigai/termtrace"
license-file.workspace = true
rust-version = "1.97.1"

[dependencies]
fs-err = "3.2.0"
schemars = { version = "1.1.0", features = ["uuid1"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
termtrace-model = { version = "=0.1.0", path = "../model" }
termtrace-tmux = { version = "=0.1.0", path = "../tmux" }

[dev-dependencies]
jsonschema = { version = "0.33.0", default-features = false }

[lints]
workspace = true
