[package]
name = "termtrace-tmux"
version = "0.1.0"
edition = "2024"
description = "Aggregate tmux recording: typed lifecycle events, a pure reducer, and its own journal and catalog"
repository = "https://github.com/zigai/termtrace"
license-file.workspace = true
rust-version = "1.97.1"

[dependencies]
termtrace-model = { version = "=0.1.0", path = "../model" }
termtrace-evidence = { version = "=0.1.0", path = "../evidence" }
termtrace-control = { version = "=0.1.0", path = "../control" }
termtrace-process = { version = "=0.1.0", path = "../process" }
blake3 = "1.8.2"
fs-err = "3.2.0"
nix = { version = "0.30.1", features = ["fs", "user"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["libsqlite3-sys", "bundled", "fallible_uint"] }
schemars = { version = "1.1.0", features = ["uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
