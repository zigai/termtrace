[package]
name = "termtrace-sdk"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
termtrace-model = { path = "../model" }
termtrace-evidence = { path = "../evidence" }
termtrace-engine = { path = "../engine" }
termtrace-export = { path = "../export" }
termtrace-media = { path = "../media" }
fs-err = "3.2.0"
nix = { version = "0.30.1", features = ["signal", "socket", "user"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
