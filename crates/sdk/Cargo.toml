[package]
name = "termtrace-sdk"
version = "0.1.0"
edition = "2024"
description = "Typed Rust client for Termtrace, with optional in-process replay and media"
repository = "https://github.com/zigai/termtrace"
license-file.workspace = true
rust-version = "1.97.1"

[features]
default = []
in-process = ["dep:termtrace-evidence", "dep:termtrace-engine", "dep:termtrace-export", "dep:termtrace-media", "dep:regex", "dep:tracing"]

[dependencies]
termtrace-model = { version = "=0.1.0", path = "../model" }
termtrace-evidence = { version = "=0.1.0", path = "../evidence", optional = true }
termtrace-engine = { version = "=0.1.0", path = "../engine", optional = true }
termtrace-export = { version = "=0.1.0", path = "../export", optional = true }
termtrace-media = { version = "=0.1.0", path = "../media", optional = true }
fs-err = "3.2.0"
nix = { version = "0.30.1", features = ["fs", "poll", "signal", "socket", "user"] }
regex = { version = "1.12.2", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tracing = { version = "0.1.41", optional = true }
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
