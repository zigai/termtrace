[package]
name = "termtrace-export"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
termtrace-model = { path = "../model" }
termtrace-evidence = { path = "../evidence" }
termtrace-engine = { path = "../engine" }
termtrace-render = { path = "../render" }
blake3 = "1.8.2"
fs-err = "3.2.0"
schemars = { version = "1.1.0", features = ["uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
