[package]
name = "termtrace-export"
version = "0.1.0"
edition = "2024"
description = "Verifiable terminal evidence exports for Termtrace"
repository = "https://github.com/zigai/termtrace"
license-file.workspace = true
rust-version = "1.97.1"

[dependencies]
termtrace-model = { version = "=0.1.0", path = "../model" }
termtrace-evidence = { version = "=0.1.0", path = "../evidence" }
termtrace-engine = { version = "=0.1.0", path = "../engine" }
termtrace-render = { version = "=0.1.0", path = "../render" }
termtrace-tmux = { version = "=0.1.0", path = "../tmux" }
blake3 = "1.8.2"
fs-err = "3.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
