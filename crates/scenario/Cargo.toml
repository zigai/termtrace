[package]
name = "termtrace-scenario"
version = "0.1.0"
edition = "2024"
description = "Strict evidence-native terminal scenario test runner for Termtrace"
repository = "https://github.com/zigai/termtrace"
license-file.workspace = true
rust-version = "1.97.1"

[dependencies]
blake3 = "1.8.2"
fs-err = "3.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_path_to_error = "0.1.20"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
thiserror = "2.0.17"
xmlwriter = "0.1.0"
zstd = "0.13.3"
termtrace-model = { version = "=0.1.0", path = "../model" }
termtrace-control = { version = "=0.1.0", path = "../control" }
termtrace-evidence = { version = "=0.1.0", path = "../evidence" }
termtrace-engine = { version = "=0.1.0", path = "../engine" }
termtrace-render = { version = "=0.1.0", path = "../render" }
termtrace-service = { version = "=0.1.0", path = "../service" }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
