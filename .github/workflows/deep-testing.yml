name: Deep testing

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Deep-testing suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - security
          - fuzz
          - miri
          - sanitizer
          - concurrency-model
          - coverage
          - mutation
          - benchmarks
  schedule:
    - cron: "17 3 * * 1"
    - cron: "43 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite || github.event.schedule }}
  cancel-in-progress: true

jobs:
  security:
    if: >-
      github.event.schedule == '17 3 * * 1' ||
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'security'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-security
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file Cargo.lock
          cargo audit --file fuzz/Cargo.lock
      - name: Audit TypeScript dependencies
        working-directory: packages/typescript
        run: bun audit
      - name: Audit Python dependencies
        run: |
          uv export --project packages/python --locked --group dev --format requirements-txt --no-hashes --output-file "$RUNNER_TEMP/python-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --requirement "$RUNNER_TEMP/python-requirements.txt"

  fuzz:
    if: >-
      github.event.schedule == '17 3 * * 1' ||
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'fuzz'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          toolchain: nightly-2026-08-25
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Bootstrap pinned Ghostty
        run: scripts/bootstrap.sh
      - name: Run bounded fuzz campaigns
        run: |
          cargo fuzz run output_projection fuzz/corpus/output_projection -- -max_total_time=60 -timeout=5 -max_len=4096
          cargo fuzz run control_protocol fuzz/corpus/control_protocol -- -max_total_time=60 -timeout=5 -max_len=16384
          cargo fuzz run event_log fuzz/corpus/event_log -- -max_total_time=60 -timeout=5 -max_len=262144
          cargo fuzz run bundle_archive fuzz/corpus/bundle_archive -- -max_total_time=60 -timeout=5 -max_len=262144
      - name: Upload fuzz failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failures
          path: fuzz/artifacts/
          if-no-files-found: ignore

  miri:
    if: >-
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'miri'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          toolchain: nightly-2026-08-25
          components: miri
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-miri
      - run: cargo miri setup
      - run: cargo miri test --locked -p termtrace-model --lib

  sanitizer:
    if: >-
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'sanitizer'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: detect_leaks=1
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          toolchain: nightly-2026-08-25
          components: rust-src
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-asan
      - name: Bootstrap pinned Ghostty
        run: scripts/bootstrap.sh
      - name: Run address sanitizer over the terminal boundary
        run: cargo test --locked -Zbuild-std --target x86_64-unknown-linux-gnu -p termtrace-terminal --lib

  concurrency-model:
    if: >-
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'concurrency-model'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-concurrency-model
      - name: Bootstrap pinned Ghostty
        run: scripts/bootstrap.sh
      - run: cargo test --locked -p termtrace-engine connection_limiter

  coverage:
    if: >-
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'coverage'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Bootstrap pinned Ghostty
        run: scripts/bootstrap.sh
      - name: Generate diagnostic coverage artifact
        run: |
          mkdir -p coverage
          cargo llvm-cov --locked --workspace --lib --bins --lcov --output-path coverage/lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-coverage
          path: coverage/lcov.info
          if-no-files-found: error

  mutation:
    if: >-
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'mutation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-mutation
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Bootstrap pinned Ghostty
        run: scripts/bootstrap.sh
      - name: Mutate the streaming control-stripper boundary
        run: cargo mutants --cargo-arg=--locked -p termtrace-terminal -f crates/terminal/src/output_projection.rs --timeout 60 --jobs 2
      - name: Upload mutation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-results
          path: mutants.out/
          if-no-files-found: warn

  benchmarks:
    if: >-
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'benchmarks'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-benchmarks
      - name: Bootstrap pinned native dependencies
        run: scripts/bootstrap.sh
      - name: Build optimized Termtrace binary
        run: cargo build --locked --release --all-features
      - name: Record advisory benchmark evidence
        env:
          REPETITIONS: 5
          RENDER_REPETITIONS: 2
          RENDER_WARMUPS: 1
        run: |
          benchmarks/run-agent-workflows.sh
          benchmarks/run-durability.sh
          benchmarks/run-render.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmarks/results/
          if-no-files-found: error
          retention-days: 90
