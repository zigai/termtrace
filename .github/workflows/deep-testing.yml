name: Deep testing

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Deep-testing suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - security
          - fuzz
          - miri
          - sanitizer
          - concurrency-model
          - coverage
          - mutation
          - benchmarks
  schedule:
    - cron: "17 3 * * 1"
    - cron: "43 3 1 * *"

permissions:
  contents: read

env:
  TERM: xterm-256color
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite || github.event.schedule }}
  cancel-in-progress: true

jobs:
  security:
    if: >-
      github.event.schedule == '17 3 * * 1' ||
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'security'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-security
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          scripts/ci-run.sh audit-rust cargo audit --file Cargo.lock
          scripts/ci-run.sh audit-fuzz cargo audit --file fuzz/Cargo.lock
      - name: Upload security failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-failure
          path: target/ci-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  fuzz:
    if: >-
      github.event.schedule == '17 3 * * 1' ||
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'fuzz'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          toolchain: nightly-2026-08-25
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Provision fuzz runtime
        run: scripts/ci-run.sh setup scripts/ci-setup.sh core
      - name: Run fuzz campaigns and replay native VT seeds
        run: |
          scripts/ci-run.sh fuzz-output cargo fuzz run output_projection fuzz/corpus/output_projection -- -max_total_time=60 -timeout=5 -max_len=4096
          scripts/ci-run.sh fuzz-control cargo fuzz run control_protocol fuzz/corpus/control_protocol -- -max_total_time=60 -timeout=5 -max_len=16384
          scripts/ci-run.sh fuzz-events cargo fuzz run event_log fuzz/corpus/event_log -- -max_total_time=60 -timeout=5 -max_len=262144
          scripts/ci-run.sh fuzz-bundle cargo fuzz run bundle_archive fuzz/corpus/bundle_archive -- -max_total_time=60 -timeout=5 -max_len=262144
          scripts/ci-run.sh fuzz-vt cargo fuzz run ghostty_vt fuzz/corpus/ghostty_vt -- -runs=0 -timeout=5 -max_len=4096
      - name: Upload fuzz failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failures
          path: |
            fuzz/artifacts/
            target/ci-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  miri:
    if: >-
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'miri'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          toolchain: nightly-2026-08-25
          components: miri
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-miri
      - run: cargo miri setup
      - run: scripts/ci-run.sh miri cargo miri test --locked -p termtrace-model --lib
      - name: Upload Miri failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: miri-failure
          path: target/ci-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  sanitizer:
    if: >-
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'sanitizer'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: detect_leaks=1
      RUSTFLAGS: -Zsanitizer=address
      TERMTRACE_SANITIZE: address
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          toolchain: nightly-2026-08-25
          components: rust-src
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-asan
      - name: Provision sanitizer runtime
        env:
          TERMTRACE_SANITIZE: address
        run: scripts/ci-run.sh setup scripts/ci-setup.sh core
      - name: Run address sanitizer over the terminal boundary
        run: scripts/ci-run.sh sanitizer cargo test --locked -Zbuild-std --target x86_64-unknown-linux-gnu -p termtrace-terminal --lib
      - name: Upload sanitizer failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sanitizer-failure
          path: target/ci-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  concurrency-model:
    if: >-
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'concurrency-model'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: -Zsanitizer=thread
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          toolchain: nightly-2026-08-25
          components: rust-src
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-concurrency-model
      - name: Provision concurrency runtime
        run: scripts/ci-run.sh setup scripts/ci-setup.sh core
      - name: Run thread sanitizer over concurrency paths
        run: scripts/ci-run.sh concurrency cargo test --locked -Zbuild-std --target x86_64-unknown-linux-gnu -p termtrace-engine --lib -- connection_limiter reservation_excludes control_server_accepts_a_second_request runtime_workers parallel_resolution
      - name: Upload concurrency failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: concurrency-failure
          path: target/ci-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  coverage:
    if: >-
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'coverage'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Provision coverage runtime
        run: scripts/ci-run.sh setup scripts/ci-setup.sh native
      - name: Generate diagnostic coverage artifact
        run: |
          mkdir -p coverage
          scripts/ci-run.sh coverage cargo llvm-cov --locked --workspace --lib --bins --test cli --no-clean --lcov --output-path coverage/lcov.info
      - name: Verify coverage baseline threshold
        run: |
          scripts/ci-run.sh coverage-summary cargo llvm-cov report
          scripts/ci-run.sh coverage-baseline cargo llvm-cov report --fail-under-lines 70 || {
            echo "::warning::Coverage is below advisory baseline threshold of 70%"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rust-coverage
          path: |
            coverage/lcov.info
            target/ci-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  mutation:
    if: >-
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'mutation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-mutation
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Provision mutation runtime
        run: scripts/ci-run.sh setup scripts/ci-setup.sh core
      - name: Mutate the streaming control-stripper and screen boundary
        run: scripts/ci-run.sh mutation cargo mutants --cargo-arg=--locked -p termtrace-terminal -f crates/terminal/src/output_projection.rs -f crates/terminal/src/screen.rs --timeout 60 --jobs 2
      - name: Upload mutation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-results
          path: |
            mutants.out/
            target/ci-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  benchmarks:
    if: >-
      github.event.schedule == '43 3 1 * *' ||
      inputs.suite == 'all' ||
      inputs.suite == 'benchmarks'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.10
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: deep-benchmarks
      - name: Provision benchmark runtime
        run: scripts/ci-run.sh setup scripts/ci-setup.sh native
      - name: Install benchmark dependencies
        run: uv sync --project benchmarks
      - name: Build optimized Termtrace binary
        run: cargo build --locked --release --all-features
      - name: Record advisory benchmark evidence
        env:
          REPETITIONS: 5
          RENDER_REPETITIONS: 2
          RENDER_WARMUPS: 1
        run: |
          scripts/ci-run.sh benchmark-agent benchmarks/run-agent-workflows.sh
          scripts/ci-run.sh benchmark-durability benchmarks/run-durability.sh
          scripts/ci-run.sh benchmark-render benchmarks/run-render.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            benchmarks/results/
            target/ci-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
