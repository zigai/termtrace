name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-linux-gnu.2.28
            wheel_platform: manylinux_2_28_x86_64
            npm_arch: x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            zig_target: aarch64-linux-gnu.2.28
            wheel_platform: manylinux_2_28_aarch64
            npm_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: sudo apt-get update && sudo apt-get install --yes b3sum
      - run: python3 scripts/check-release-versions.py
      - run: cargo install cargo-zigbuild --version 0.23.0 --locked
      - run: scripts/bootstrap.sh
        env:
          TERMTRACE_ZIG_TARGET: ${{ matrix.zig_target }}
      - name: Add pinned Zig to PATH
        run: |
          zig=$(find .tools -type f -path '*/zig' -perm -u+x -print -quit)
          test -n "$zig"
          dirname "$zig" >> "$GITHUB_PATH"
      - run: cargo test --locked --workspace --all-features
      - run: cargo zigbuild --locked --release --all-features --target "${{ matrix.target }}.2.28"
        env:
          TERMTRACE_BUILD_REVISION: ${{ github.sha }}
      - run: scripts/check-glibc-compat.sh "target/${{ matrix.target }}/release/termtrace" 2.28
      - name: Test standalone Rust process client
        run: bash scripts/ci-rust-consumer.sh
        env:
          TERMTRACE_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/termtrace
      - run: bun install --cwd packages/typescript --frozen-lockfile && bun run --cwd packages/typescript build
      - name: Package deterministic archive
        run: |
          root="termtrace-${{ matrix.target }}"
          mkdir -p "dist/$root/clients/python" "dist/$root/clients/typescript"
          install -m 0555 "target/${{ matrix.target }}/release/termtrace" "dist/$root/termtrace"
          install -m 0444 LICENSE README.md crates/render/assets/fonts/NOTICE "dist/$root/"
          install -m 0444 packages/python/pyproject.toml packages/python/README.md "dist/$root/clients/python/"
          cp -R packages/python/termtrace "dist/$root/clients/python/"
          install -m 0444 packages/typescript/package.json packages/typescript/README.md "dist/$root/clients/typescript/"
          cp -R packages/typescript/lib "dist/$root/clients/typescript/"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C dist -cf - "$root" | gzip -9 -n > "dist/$root.tar.gz"
          (cd dist && sha256sum "$root.tar.gz" > "$root.tar.gz.sha256")
          (cd dist && b3sum "$root.tar.gz" > "$root.tar.gz.blake3")
          rm -rf "dist/$root"
      - run: scripts/validate-release-archive.sh "dist/termtrace-${{ matrix.target }}.tar.gz"
      - name: Test shell installer
        run: |
          install_root=$(mktemp -d)
          trap 'rm -rf "$install_root"' EXIT
          TERMTRACE_DOWNLOAD_BASE="file://$PWD/dist" ./install.sh --install-dir "$install_root/bin"
          cmp "target/${{ matrix.target }}/release/termtrace" "$install_root/bin/termtrace"
          test -f "$install_root/share/termtrace/clients/python/pyproject.toml"
          test -f "$install_root/share/termtrace/clients/typescript/lib/index.js"
          "$install_root/bin/termtrace" doctor --require core,semantic
          "$install_root/bin/termtrace" tooling client status
      - name: Package shell installer
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          install -m 0555 install.sh dist/termtrace-installer.sh
          (cd dist && sha256sum termtrace-installer.sh > termtrace-installer.sh.sha256)
      - name: Build platform client packages
        run: |
          binary="target/${{ matrix.target }}/release/termtrace"
          scripts/build-python-wheel.sh "$binary" "${{ matrix.wheel_platform }}"
          scripts/build-npm-platform-package.sh "$binary" linux "${{ matrix.npm_arch }}"
      - name: Build TypeScript client package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: packages/typescript
        run: |
          bun install --frozen-lockfile
          bun run build
          npm pack --pack-destination ../../dist/npm
      - name: Test Python wheel command
        run: |
          wheel_root=$(mktemp -d)
          trap 'rm -rf "$wheel_root"' EXIT
          uv venv --python 3.11 "$wheel_root/venv"
          uv pip install --python "$wheel_root/venv/bin/python" dist/python/*.whl
          "$wheel_root/venv/bin/termtrace" doctor --require core,semantic
          cp tests/consumers/python/verify.py "$wheel_root/verify.py"
          (cd "$wheel_root" && env -u TERMTRACE_BINARY "$wheel_root/venv/bin/python" verify.py)
      - name: Test npm command
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          npm_root=$(mktemp -d)
          trap 'rm -rf "$npm_root"' EXIT
          npm install --prefix "$npm_root" dist/npm/termtrace-cli-linux-x64-*.tgz dist/npm/termtrace-test-*.tgz
          node "$npm_root/node_modules/@termtrace/test/bin/termtrace.js" doctor --require core,semantic
          cp tests/consumers/typescript/verify.mjs "$npm_root/verify.mjs"
          (cd "$npm_root" && env -u TERMTRACE_BINARY node verify.mjs)
      - name: Checksum client packages
        run: find dist/python dist/npm -type f -print0 | sort -z | xargs -0 sha256sum > "dist/termtrace-${{ matrix.target }}-packages.sha256"
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename "termtrace-${{ matrix.target }}.cdx"
          mv "termtrace-${{ matrix.target }}.cdx.json" dist/
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/termtrace-${{ matrix.target }}.tar.gz
            dist/python/*.whl
            dist/npm/*.tgz
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          subject-path: dist/termtrace-installer.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termtrace-${{ matrix.target }}
          path: |
            dist/termtrace-${{ matrix.target }}*
            dist/termtrace-installer*
            dist/python/*
            dist/npm/*
          if-no-files-found: error

  rust-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: python3 scripts/check-release-versions.py
      - run: scripts/bootstrap.sh
      - run: cargo test --locked -p termtrace-sdk --no-default-features
      - run: bash scripts/build-rust-packages.sh
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/rust/*.crate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termtrace-rust-packages
          path: dist/rust/*
          if-no-files-found: error

  publish-python:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: termtrace-*-unknown-linux-gnu
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.10
      - name: Publish tested wheels to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple dist/python/*.whl

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: termtrace-*-unknown-linux-gnu
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org
      - name: Publish platform binaries before the client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in dist/npm/termtrace-cli-*.tgz; do
            npm publish "$package" --access public --provenance
          done
          npm publish dist/npm/termtrace-test-*.tgz --access public --provenance

  publish-crates:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, rust-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: scripts/bootstrap.sh
      - name: Publish the tested Rust dependency graph
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TERMTRACE_GHOSTTY_PREFIX: ${{ github.workspace }}/vendor/ghostty/zig-out
        run: |
          cargo publish --locked \
            -p termtrace-model -p termtrace-terminal -p termtrace-evidence \
            -p termtrace-engine -p termtrace-render -p termtrace-media \
            -p termtrace-export -p termtrace-sdk

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, rust-packages, publish-python, publish-npm, publish-crates]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: termtrace-*
          path: dist
          merge-multiple: true
      - name: Create immutable tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find dist -type f -print0 | sort -z)
          test "${#assets[@]}" -gt 0
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --verify-tag --generate-notes
