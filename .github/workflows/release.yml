name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg bison libevent-dev libncurses-dev pkg-config
      # Termtrace needs tmux 3.6 or newer; Ubuntu 24.04 ships 3.4.
      - name: Install tmux 3.6a
        run: |
          sudo apt-get remove --yes tmux
          curl --fail --location --output "$RUNNER_TEMP/tmux.tar.gz" https://github.com/tmux/tmux/releases/download/3.6a/tmux-3.6a.tar.gz
          echo "b6d8d9c76585db8ef5fa00d4931902fa4b8cbe8166f528f44fc403961a3f3759  $RUNNER_TEMP/tmux.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/tmux.tar.gz" --directory "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-3.6a" && ./configure --prefix=/usr && make --jobs "$(nproc)" && sudo make install
          tmux -V
      - run: python3 scripts/check-release-versions.py
      - run: scripts/bootstrap.sh
        env:
          # Zig otherwise tunes libghostty-vt for the runner's CPU.
          TERMTRACE_ZIG_EXTRA_ARGS: -Dcpu=baseline
      - run: cargo test --locked --workspace --all-features
      - run: cargo build --locked --release --all-features --target "${{ matrix.target }}"
      - name: Test standalone Rust process client
        run: bash scripts/test-rust-consumer.sh
        env:
          TERMTRACE_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/termtrace
      - name: Package deterministic archive
        run: |
          root="termtrace-${{ matrix.target }}"
          mkdir -p "dist/$root"
          install -m 0555 "target/${{ matrix.target }}/release/termtrace" "dist/$root/termtrace"
          install -m 0444 LICENSE README.md crates/render/assets/fonts/NOTICE "dist/$root/"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C dist -cf - "$root" | gzip -9 -n > "dist/$root.tar.gz"
          (cd dist && sha256sum "$root.tar.gz" > "$root.tar.gz.sha256")
          rm -rf "dist/$root"
      - run: scripts/validate-release-archive.sh "dist/termtrace-${{ matrix.target }}.tar.gz"
      - name: Test shell installer
        run: |
          install_root=$(mktemp -d)
          trap 'rm -rf "$install_root"' EXIT
          TERMTRACE_DOWNLOAD_BASE="file://$PWD/dist" ./install.sh --install-dir "$install_root/bin"
          cmp "target/${{ matrix.target }}/release/termtrace" "$install_root/bin/termtrace"
          "$install_root/bin/termtrace" doctor --require core,semantic
      - name: Build and test Python wheel
        run: |
          scripts/package-python.sh "${{ matrix.target }}" "target/${{ matrix.target }}/release/termtrace"
          scripts/test-language-packages.sh python dist/python/termtrace-*.whl
      - name: Pack and test npm packages
        run: |
          scripts/package-node.sh "${{ matrix.target }}" "target/${{ matrix.target }}/release/termtrace"
          scripts/package-node.sh main
          scripts/test-language-packages.sh node dist/npm/zigai-termtrace-[0-9]*.tgz dist/npm/zigai-termtrace-linux-*.tgz
      - name: Keep one main npm package
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: rm dist/npm/zigai-termtrace-[0-9]*.tgz
      - name: Package shell installer
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          install -m 0555 install.sh dist/termtrace-installer.sh
          (cd dist && sha256sum termtrace-installer.sh > termtrace-installer.sh.sha256)
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename "termtrace-${{ matrix.target }}.cdx"
          mv "termtrace-${{ matrix.target }}.cdx.json" dist/
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/termtrace-${{ matrix.target }}.tar.gz
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          subject-path: dist/termtrace-installer.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termtrace-${{ matrix.target }}
          path: |
            dist/termtrace-${{ matrix.target }}*
            dist/termtrace-installer*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-${{ matrix.target }}
          path: dist/python/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-${{ matrix.target }}
          path: dist/npm/*.tgz
          if-no-files-found: error

  rust-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: python3 scripts/check-release-versions.py
      - run: scripts/bootstrap.sh
      - run: cargo test --locked -p termtrace-sdk --no-default-features
      - run: bash scripts/build-rust-packages.sh
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/rust/*.crate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-packages
          path: dist/rust/*
          if-no-files-found: error

  publish-crates:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, rust-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: scripts/bootstrap.sh
      - name: Publish the tested Rust dependency graph
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TERMTRACE_GHOSTTY_PREFIX: ${{ github.workspace }}/vendor/ghostty/zig-out
        run: scripts/publish-crates.sh

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, publish-crates]
    runs-on: ubuntu-24.04
    environment: pypi
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv publish --trusted-publishing always dist/*.whl

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, publish-crates]
    uses: ./.github/workflows/publish-npm.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      id-token: write

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, rust-packages, publish-crates, publish-pypi, publish-npm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: termtrace-*
          path: dist
          merge-multiple: true
      - name: Create immutable tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find dist -type f -print0 | sort -z)
          test "${#assets[@]}" -gt 0
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --verify-tag --generate-notes
      # The Go module lives in go/, so the Go proxy reads its versions from go/v* tags.
      - name: Tag the Go module
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/go/${GITHUB_REF_NAME}" -f "sha=${GITHUB_SHA}"
