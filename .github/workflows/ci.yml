name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERM: xterm-256color
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  RUST_BACKTRACE: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: check
          cache-workspace-crates: true
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.59.0,cargo-nextest@0.9.143,cargo-machete@0.9.2,cargo-audit@0.22.2,shfmt@3.14.1,editorconfig-checker@3.11.3
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends build-essential pkg-config ripgrep jq xz-utils tmux ncurses-term
      - name: Install formatters
        run: |
          uv tool install ruff==0.17.3
          uv tool install rumdl==0.3.0
          npm install --global oxfmt@0.76.0
          cargo install cargo-dylint@6.3.1 dylint-link@6.3.1 --locked
          cargo install --git https://github.com/zigai/rust-statement-spacing.git cargo-statement-spacing --tag v0.4.0 --locked
      - run: just setup
      - run: just check

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: native
          cache-workspace-crates: true
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.59.0,cargo-nextest@0.9.143
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config ripgrep jq xz-utils \
            tmux ncurses-term ffmpeg fonts-dejavu-core imagemagick xvfb xauth x11-utils dbus-daemon dbus-x11 \
            libgtk-4-dev libadwaita-1-dev libx11-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dri libegl-mesa0 \
            gettext meson ninja-build python3-gi gir1.2-gtk-4.0 gir1.2-adw-1
      - run: just setup
      # Ubuntu 24.04 ships Blueprint 0.12; this Ghostty checkout needs 0.16 or newer.
      - name: Install Blueprint
        run: |
          git init "$RUNNER_TEMP/blueprint"
          git -C "$RUNNER_TEMP/blueprint" fetch --depth 1 https://gitlab.gnome.org/GNOME/blueprint-compiler.git 04ef0944db56ab01307a29aaa7303df6067cb3c0
          git -C "$RUNNER_TEMP/blueprint" checkout --detach FETCH_HEAD
          meson setup "$RUNNER_TEMP/blueprint/build" "$RUNNER_TEMP/blueprint" --prefix "$RUNNER_TEMP/tools" -Ddocs=false
          meson install -C "$RUNNER_TEMP/blueprint/build"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Build Ghostty
        working-directory: vendor/ghostty
        run: |
          zig=$(find "$GITHUB_WORKSPACE/.tools" -type f -path '*/zig' -perm -u+x -print -quit)
          "$zig" build -Doptimize=ReleaseFast -Dapp-runtime=gtk -Dgtk-x11=true -Dgtk-wayland=false -Demit-docs=false -Demit-terminfo=true
          echo "$PWD/zig-out/bin" >> "$GITHUB_PATH"
          echo "TERMINFO_DIRS=$PWD/zig-out/share/terminfo:/usr/share/terminfo:/lib/terminfo" >> "$GITHUB_ENV"
      - run: npm ci --prefix tests/consumers/node_native
      - run: just integration
      - run: just bindings-test
      - run: just native-check
      - run: just native-test
