name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy,rustfmt
      - name: Install headless Ghostty config fixture
        run: echo "$GITHUB_WORKSPACE/tests/fixtures/bin" >> "$GITHUB_PATH"
      - run: bash -n install.sh benchmarks/*.sh scripts/*.sh demos/*.sh demos/apps/*.sh
      - run: bash tests/install.sh
      - run: python3 -m py_compile demos/apps/terminal_showcase.py
      - run: scripts/bootstrap.sh
      - run: cargo fmt --all -- --check
      - run: cargo metadata --no-deps --format-version 1 >/dev/null
      - run: cargo test --locked --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v7
      - run: bun install --frozen-lockfile
        working-directory: packages/typescript
      - run: scripts/generate-client-protocol.sh
      - name: Check generated client contracts
        run: git diff --exit-code -- packages/python/src/termtrace/_generated packages/typescript/src/generated
      - run: bun test
        working-directory: packages/typescript
      - run: node --check bin/termtrace.js
        working-directory: packages/typescript
      - run: bunx tsc -p tsconfig.json --noEmit
        working-directory: packages/typescript
      - run: bunx tsc -p tsconfig.test.json --noEmit
        working-directory: packages/typescript
      - run: uv run --project packages/python --with pytest pytest -q packages/python/tests
      - run: uv run --project packages/python --with mypy --with pytest mypy packages/python/src packages/python/tests
      - run: uv run --project packages/python --with ruff ruff check packages/python/src/termtrace packages/python/scripts packages/python/tests --exclude packages/python/src/termtrace/_generated
      - run: uv run --project packages/python --with ruff ruff format --check packages/python/src/termtrace packages/python/scripts packages/python/tests --exclude packages/python/src/termtrace/_generated
