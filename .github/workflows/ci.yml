name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERM: xterm-256color
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  RUST_BACKTRACE: "1"
  BASE_PACKAGES: build-essential pkg-config ripgrep jq xz-utils tmux ncurses-term ffmpeg
  NATIVE_PACKAGES: >-
    build-essential pkg-config ripgrep jq xz-utils tmux ncurses-term ffmpeg
    fonts-dejavu-core fonts-jetbrains-mono imagemagick xvfb xauth x11-utils dbus-daemon dbus-x11
    libgtk-4-dev libadwaita-1-dev libx11-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dri libegl-mesa0
    gettext meson ninja-build python3-gi gir1.2-gtk-4.0 gir1.2-adw-1

jobs:
  # Builds libghostty-vt and the Ghostty app once per pinned revision; every other job restores it.
  ghostty:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Bump the version when the Ghostty build flags or Blueprint pin change.
      - id: key
        run: echo "key=ghostty-v2-$ImageOS-$(uname -m)-${{ hashFiles('crates/terminal/ghostty-revision', 'scripts/bootstrap.sh', 'scripts/bootstrap-ghostty-vt.sh') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/ghostty/zig-out
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/apt
        with:
          packages: ${{ env.NATIVE_PACKAGES }}
      # Ubuntu 26.04 ships Blueprint 0.19; this Ghostty checkout needs 0.20 or newer.
      - name: Install Blueprint
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git init "$RUNNER_TEMP/blueprint"
          git -C "$RUNNER_TEMP/blueprint" fetch --depth 1 https://gitlab.gnome.org/GNOME/blueprint-compiler.git 31b62c24a72c1670d2d93dcdf2d130f1ae12778e
          git -C "$RUNNER_TEMP/blueprint" checkout --detach FETCH_HEAD
          meson setup "$RUNNER_TEMP/blueprint/build" "$RUNNER_TEMP/blueprint" --prefix "$RUNNER_TEMP/tools" -Ddocs=false
          meson install -C "$RUNNER_TEMP/blueprint/build"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      # Runners differ in CPU, so cached builds target the baseline CPU instead of the builder's.
      - name: Build libghostty-vt
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          TERMTRACE_ZIG_EXTRA_ARGS: -Dcpu=baseline
        run: scripts/bootstrap.sh
      - name: Build Ghostty
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: vendor/ghostty
        run: |
          zig=$(find "$GITHUB_WORKSPACE/.tools" -type f -path '*/zig' -perm -u+x -print -quit)
          "$zig" build -Dcpu=baseline -Doptimize=ReleaseFast -Dapp-runtime=gtk -Dgtk-x11=true -Dgtk-wayland=false -Demit-docs=false -Demit-terminfo=true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/ghostty/zig-out
          key: ${{ steps.key.outputs.key }}

  lint:
    needs: ghostty
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          packages: ${{ env.BASE_PACKAGES }}
          ghostty-key: ${{ needs.ghostty.outputs.key }}
          rust-cache: lint
          # A lint failure before the first compile would save a cache with no build output.
          rust-cache-on-failure: "false"
          components: clippy,rustfmt
          tools: just@1.59.0,cargo-machete@0.9.2,cargo-audit@0.22.2,shfmt@3.14.1,editorconfig-checker@3.11.3
      - name: Install formatters
        run: |
          uv tool install ruff==0.17.3
          uv tool install rumdl==0.3.0
          npm install --global oxfmt@0.76.0
          cargo install cargo-dylint@6.3.1 dylint-link@6.3.1 --locked
          cargo install --git https://github.com/zigai/rust-statement-spacing.git cargo-statement-spacing --tag v0.4.0 --locked
      - run: just formatcheck lockcheck audit lint bindings-lint

  test:
    needs: ghostty
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          packages: ${{ env.BASE_PACKAGES }}
          ghostty-key: ${{ needs.ghostty.outputs.key }}
          rust-cache: test
      - run: just test test-recording

  integration:
    needs: ghostty
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          packages: ${{ env.NATIVE_PACKAGES }}
          ghostty-key: ${{ needs.ghostty.outputs.key }}
          rust-cache: integration
          ghostty-on-path: "true"
      - run: just integration

  python:
    needs: ghostty
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          packages: ${{ env.NATIVE_PACKAGES }}
          ghostty-key: ${{ needs.ghostty.outputs.key }}
          rust-cache: python
          ghostty-on-path: "true"
      - run: just build-python test-python

  node:
    needs: ghostty
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          packages: ${{ env.NATIVE_PACKAGES }}
          ghostty-key: ${{ needs.ghostty.outputs.key }}
          rust-cache: node
          ghostty-on-path: "true"
      - run: npm ci --prefix tests/consumers/node_native
      - run: just build-node test-node

  native:
    needs: ghostty
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          packages: ${{ env.NATIVE_PACKAGES }}
          ghostty-key: ${{ needs.ghostty.outputs.key }}
          rust-cache: native
          ghostty-on-path: "true"
      - run: just native-check native-test
