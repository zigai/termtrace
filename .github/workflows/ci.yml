name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: ci
          cache-workspace-crates: true
      - name: Provision test runtime
        run: scripts/ci-run.sh setup scripts/ci-setup.sh native
      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked
      - name: Install cargo-statement-spacing
        run: |
          cargo install cargo-dylint dylint-link --version '=6.0.4' --locked
          cargo install --git https://github.com/zigai/rust-statement-spacing.git cargo-statement-spacing --tag v0.4.0 --locked
      - run: scripts/ci-run.sh rust scripts/ci-rust.sh
      - name: Upload Rust failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-failure
          path: target/ci-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: ci
          cache-workspace-crates: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.10
      - name: Provision test runtime
        run: scripts/ci-run.sh setup scripts/ci-setup.sh native
      - run: scripts/ci-run.sh integration scripts/ci-integration.sh
      - name: Upload integration failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-failure
          path: target/ci-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: ci
          cache-workspace-crates: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.10
      - name: Provision test runtime
        run: scripts/ci-run.sh setup scripts/ci-setup.sh native
      - run: scripts/ci-run.sh clients scripts/ci-clients.sh
      - name: Upload client failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clients-failure
          path: target/ci-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: ci
          cache-workspace-crates: true
      - name: Provision real Ghostty and capture runtime
        run: scripts/ci-run.sh setup scripts/ci-setup.sh native
      - name: Run native capture smoke test
        run: scripts/ci-run.sh native-smoke scripts/native-smoke-test.sh --output "$RUNNER_TEMP/native-smoke.termtrace" --keep-log
      - name: Exercise operational capability failures
        env:
          TERMTRACE_BINARY: ${{ github.workspace }}/target/debug/termtrace
        run: scripts/ci-run.sh native-capability bash scripts/native-capability-test.sh
      - name: Exercise retained native export
        run: scripts/ci-run.sh native-retained cargo test --locked --test cli retained_native_video_exports_without_native_capture_tools -- --ignored
      - name: Exercise original capture and cancellation
        run: scripts/ci-run.sh native-original cargo test --locked --test cli original_native -- --ignored
      - name: Upload native smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-smoke-failure
          path: |
            target/ci-evidence/
            ${{ runner.temp }}/native-smoke.termtrace
            ${{ runner.temp }}/native-smoke.termtrace.smoke.log
          include-hidden-files: true
          if-no-files-found: warn
