name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt
      - run: bash -n scripts/*.sh demos/*.sh demos/apps/*.sh
      - run: python3 -m py_compile demos/apps/terminal_showcase.py
      - run: cargo fmt --all -- --check
      - run: cargo metadata --no-deps --format-version 1 >/dev/null
