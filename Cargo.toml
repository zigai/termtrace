[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/control",
    "crates/process",
    "crates/tmux",
    "crates/terminal",
    "crates/evidence",
    "crates/engine",
    "crates/render",
    "crates/media",
    "crates/export",
    "crates/service",
    "crates/sdk",
    "crates/scenario",
    "crates/schema",
    "crates/test-fixture",
    "crates/bindings-python",
    "crates/bindings-node",
]
exclude = ["fuzz", "tests/consumers/rust"]

[workspace.package]
license-file = "LICENSE"

[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/zigai/rust-statement-spacing", pattern = "lint", tag = "v0.4.0" },
]

[package]
name = "termtrace"
default-run = "termtrace"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Native-Ghostty terminal recording and semantic debugging for humans and agents"
repository = "https://github.com/zigai/termtrace"
license-file.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/termtrace-{ target }.tar.gz"
bin-dir = "termtrace-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
base64 = "0.22.1"
blake3 = "1.8.2"
clap = { version = "4.5.51", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5.61"
crossterm = "0.28.1"
fs-err = "3.2.0"
miette = { version = "7.6.0", features = ["fancy"] }
nix = { version = "0.30.1", features = ["fs", "user"] }
ratatui = "0.29.0"
signal-hook = "0.3.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
termtrace-control = { path = "crates/control" }
termtrace-engine = { path = "crates/engine" }
termtrace-evidence = { path = "crates/evidence" }
termtrace-export = { path = "crates/export" }
termtrace-media = { path = "crates/media" }
termtrace-model = { path = "crates/model" }
termtrace-process = { path = "crates/process" }
termtrace-render = { path = "crates/render" }
termtrace-scenario = { path = "crates/scenario" }
termtrace-schema = { path = "crates/schema" }
    termtrace-service = { path = "crates/service" }
    termtrace-sdk = { path = "crates/sdk", features = ["in-process"] }
termtrace-terminal = { path = "crates/terminal" }
termtrace-tmux = { path = "crates/tmux" }
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
assert_cmd = "2.0.17"
jsonschema = { version = "0.33.0", default-features = false }
predicates = "3.1.3"
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
roxmltree = "0.20.0"
portable-pty = "0.9.0"
zstd = "0.13.3"
cargo_metadata = "0.23.1"

[lints]
workspace = true

[workspace.lints.rust]
dead_code = "deny"
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
absolute_paths = "deny"
assigning_clones = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
branches_sharing_code = "warn"
cast_lossless = "deny"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
clone_on_ref_ptr = "deny"
cloned_instead_of_copied = "deny"
create_dir = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
derive_partial_eq_without_eq = "warn"
doc_markdown = "warn"
drop_non_drop = "deny"
empty_drop = "deny"
enum_glob_use = "deny"
exit = "deny"
expect_used = "deny"
fallible_impl_from = "deny"
filetype_is_file = "deny"
flat_map_option = "deny"
float_cmp_const = "deny"
fn_params_excessive_bools = "deny"
fn_to_numeric_cast_any = "deny"
format_push_string = "deny"
get_unwrap = "deny"
host_endian_bytes = "deny"
if_then_some_else_none = "deny"
ignore_without_reason = "deny"
implicit_return = "deny"
indexing_slicing = "deny"
io_other_error = "deny"
iter_filter_is_ok = "deny"
iter_filter_is_some = "deny"
iter_kv_map = "deny"
large_stack_arrays = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
lines_filter_map_ok = "deny"
lossy_float_literal = "deny"
manual_abs_diff = "deny"
manual_assert = "deny"
manual_bits = "deny"
manual_clamp = "deny"
manual_div_ceil = "deny"
manual_flatten = "deny"
manual_hash_one = "deny"
manual_instant_elapsed = "deny"
manual_is_ascii_check = "deny"
manual_is_power_of_two = "deny"
manual_is_variant_and = "deny"
manual_let_else = "deny"
manual_midpoint = "deny"
manual_pattern_char_comparison = "deny"
manual_range_contains = "deny"
manual_rem_euclid = "deny"
manual_repeat_n = "deny"
manual_retain = "deny"
manual_split_once = "deny"
manual_strip = "deny"
map_err_ignore = "deny"
map_unwrap_or = "deny"
match_wildcard_for_single_variants = "deny"
mem_forget = "deny"
mem_replace_option_with_some = "deny"
mem_replace_with_default = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
mutex_atomic = "deny"
needless_collect = "deny"
needless_continue = "deny"
needless_raw_string_hashes = "deny"
needless_raw_strings = "deny"
needless_return = "allow"
non_std_lazy_statics = "deny"
option_if_let_else = "deny"
option_option = "deny"
or_fun_call = "deny"
panic = "deny"
panic_in_result_fn = "deny"
print_stderr = "deny"
question_mark = "deny"
rc_mutex = "deny"
redundant_clone = "deny"
redundant_else = "warn"
ref_patterns = "deny"
renamed_function_params = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_item_push = "deny"
same_name_method = "deny"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "deny"
single_char_lifetime_names = "deny"
stable_sort_primitive = "deny"
string_lit_as_bytes = "deny"
string_slice = "deny"
struct_excessive_bools = "deny"
suspicious_xor_used_as_pow = "deny"
tests_outside_test_module = "allow"
todo = "deny"
too_many_arguments = "allow"
try_err = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
uninlined_format_args = "deny"
unnecessary_box_returns = "deny"
unnecessary_join = "deny"
unnecessary_literal_unwrap = "deny"
unnecessary_struct_initialization = "deny"
unnecessary_wraps = "deny"
unnested_or_patterns = "deny"
unreachable = "deny"
unreadable_literal = "deny"
unused_async = "deny"
unused_peekable = "deny"
unused_result_ok = "deny"
unused_rounding = "deny"
unwrap_used = "deny"
useless_format = "deny"
verbose_bit_mask = "deny"
verbose_file_reads = "deny"
while_let_on_iterator = "deny"
wildcard_imports = "deny"
write_with_newline = "deny"
writeln_empty_string = "deny"
zero_sized_map_values = "deny"
[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
