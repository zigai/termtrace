[package]
name = "termtrace"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
description = "Native-Ghostty terminal recording and semantic debugging for humans and agents"
repository = "https://github.com/zigai/termtrace"
license = "MIT"

[dependencies]
base64 = "0.22.1"
blake3 = "1.8.2"
clap = { version = "4.5.51", features = ["derive", "env"] }
fs-err = "3.2.0"
miette = { version = "7.6.0", features = ["fancy"] }
nix = { version = "0.30.1", features = ["fs", "process", "signal", "term", "user"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_path_to_error = "0.1.20"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
