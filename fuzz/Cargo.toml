[package]
name = "termtrace-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
serde_json = "1.0.145"
tempfile = "3.23.0"
termtrace-evidence = { path = "../crates/evidence" }
termtrace-model = { path = "../crates/model" }
termtrace-terminal = { path = "../crates/terminal" }

[[bin]]
name = "output_projection"
path = "fuzz_targets/output_projection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_protocol"
path = "fuzz_targets/control_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event_log"
path = "fuzz_targets/event_log.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bundle_archive"
path = "fuzz_targets/bundle_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ghostty_vt"
path = "fuzz_targets/ghostty_vt.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
